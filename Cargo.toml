[package]
name = "weaver"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
plain = "0.2"
procfs = "0.18"
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "0.26.2"
libc = "0.2"
scx_utils = { path = "scx/rust/scx_utils" }
scx_rustland_core = { path = "scx/rust/scx_rustland_core" }
clap = "4.6.1"

[build-dependencies]
scx_cargo = { path = "scx/rust/scx_cargo" }
scx_rustland_core = { path = "scx/rust/scx_rustland_core" }

[features]
enable_backtrace = []
